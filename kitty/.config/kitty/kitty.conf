# vim:fileencoding=utf-8:foldmethod=marker

# ╭──────────────────────────────────────────────────────────────╮
# │ GENERAL                                                       │
# ╰──────────────────────────────────────────────────────────────╯

# Use the user's default shell ($SHELL)
shell_integration enabled

# Large scrollback for logs, CI output, git history, etc.
scrollback_lines 20000

# Sync rendering with monitor refresh
sync_to_monitor yes

# Reduce latency
input_delay 0
repaint_delay 10

# Allow kitty remote control
allow_remote_control yes


# ╭──────────────────────────────────────────────────────────────╮
# │ FONT                                                          │
# ╰──────────────────────────────────────────────────────────────╯

font_family      FiraCode Nerd Font Mono
bold_font        FiraCode Nerd Font Mono:weight=800
italic_font      auto
bold_italic_font auto

font_size 14

# Slightly tighter terminal typography
modify_font cell_width 0.98
modify_font cell_height 0


# ╭──────────────────────────────────────────────────────────────╮
# │ CURSOR                                                        │
# ╰──────────────────────────────────────────────────────────────╯

cursor_shape block
cursor_trail 1

# Keep cursor blinking very subtle
cursor_stop_blinking_after 0.3


# ╭──────────────────────────────────────────────────────────────╮
# │ WINDOW                                                        │
# ╰──────────────────────────────────────────────────────────────╯

# AeroSpace controls the actual window placement.
remember_window_size no

initial_window_width 100c
initial_window_height 50c

placement_strategy top-left

# Minimal padding because tmux/nvim provide visual structure
window_padding_width 4
window_padding_height 3

window_margin_width 0

# Don't let Kitty add unnecessary borders
draw_minimal_borders yes


# ╭──────────────────────────────────────────────────────────────╮
# │ macOS                                                         │
# ╰──────────────────────────────────────────────────────────────╯

macos_option_as_alt yes

# Let AeroSpace manage the window; keep native title bar hidden.
hide_window_decorations titlebar-only

macos_titlebar_color background

# Transparency
background_opacity 0.55
dynamic_background_opacity yes


# ╭──────────────────────────────────────────────────────────────╮
# │ MOUSE                                                         │
# ╰──────────────────────────────────────────────────────────────╯

copy_on_select yes
detect_urls yes

mouse_hide_wait 2.0

# Don't accidentally paste with middle mouse
strip_trailing_spaces smart


# ╭──────────────────────────────────────────────────────────────╮
# │ CLIPBOARD                                                     │
# ╰──────────────────────────────────────────────────────────────╯

clipboard_control write-clipboard write-primary read-clipboard-ask

map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard


# ╭──────────────────────────────────────────────────────────────╮
# │ SEARCH                                                        │
# ╰──────────────────────────────────────────────────────────────╯

# Search terminal scrollback
map cmd+f search_scrollback
map ctrl+shift+f search_scrollback


# ╭──────────────────────────────────────────────────────────────╮
# │ FONT SIZE                                                     │
# ╰──────────────────────────────────────────────────────────────╯

map cmd+0     change_font_size all 0
map cmd+equal change_font_size all +0.5
map cmd+minus change_font_size all -0.5

map kitty_mod+0     change_font_size all 0
map kitty_mod+equal change_font_size all +0.5
map kitty_mod+minus change_font_size all -0.5


# ╭──────────────────────────────────────────────────────────────╮
# │ KITTY WINDOWS                                                 │
# ╰──────────────────────────────────────────────────────────────╯

# Kitty window = OS-level window.
# AeroSpace should normally manage these.

map kitty_mod+enter new_window_with_cwd
map kitty_mod+w close_window


# ╭──────────────────────────────────────────────────────────────╮
# │ KITTY TABS                                                    │
# ╰──────────────────────────────────────────────────────────────╯

# Keep tabs available, but don't rely on them as the primary workflow.

map kitty_mod+t new_tab_with_cwd

map kitty_mod+1 goto_tab 1
map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5

map kitty_mod+left previous_tab
map kitty_mod+right next_tab


# ╭──────────────────────────────────────────────────────────────╮
# │ LAYOUT                                                        │
# ╰──────────────────────────────────────────────────────────────╯

# Useful if multiple Kitty windows are used.
map kitty_mod+space next_layout


# ╭──────────────────────────────────────────────────────────────╮
# │ TMUX                                                          │
# ╰──────────────────────────────────────────────────────────────╯

# IMPORTANT:
# tmux owns panes/windows.
# Kitty should NOT duplicate tmux pane navigation.

# These are intentionally left to tmux:
#
# Ctrl-a / Ctrl-b
# tmux prefix + h/j/k/l
# tmux split
# tmux resize
# tmux session management


# ╭──────────────────────────────────────────────────────────────╮
# │ CONFIG RELOAD                                                  │
# ╰──────────────────────────────────────────────────────────────╯

map kitty_mod+f5 load_config_file
map ctrl+cmd+, load_config_file


# ╭──────────────────────────────────────────────────────────────╮
# │ TAB BAR                                                        │
# ╰──────────────────────────────────────────────────────────────╯

tab_bar_style powerline
tab_powerline_style slanted

tab_fade 0.25


# ╭──────────────────────────────────────────────────────────────╮
# │ URL HANDLING                                                   │
# ╰──────────────────────────────────────────────────────────────╯

# Ctrl/cmd click URLs
url_style curly


# ╭──────────────────────────────────────────────────────────────╮
# │ PERFORMANCE                                                    │
# ╰──────────────────────────────────────────────────────────────╯

# Avoid excessive redraws while typing in Neovim/tmux.
repaint_delay 10
input_delay 0

# Keep Kitty responsive with huge output.
scrollback_pager_history_size 64


# ╭──────────────────────────────────────────────────────────────╮
# │ SHELL INTEGRATION                                              │
# ╰──────────────────────────────────────────────────────────────╯

shell_integration enabled
shell_integration no-cursor


# ╭──────────────────────────────────────────────────────────────╮
# │ TERMINAL BEHAVIOR                                               │
# ╰──────────────────────────────────────────────────────────────╯

# Modern terminal capabilities
term xterm-kitty

# Don't ask before closing a terminal.
confirm_os_window_close 0


# ╭──────────────────────────────────────────────────────────────╮
# │ ADVANCED                                                       │
# ╰──────────────────────────────────────────────────────────────╯

# Preserve working directory when creating Kitty windows/tabs.
map kitty_mod+enter new_window_with_cwd
map kitty_mod+t new_tab_with_cwd
